<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OVNative · Local TTS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">OVNATIVE / LOCAL INFERENCE</p>
        <h1>把文字，变成声音。</h1>
        <p class="lede">OmniVoice 的 C++17 / CUDA 本地推理引擎。没有云端请求，没有 ONNX Runtime，没有 libtorch。</p>
      </div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="status-text">正在连接本地引擎…</span>
      </div>
    </header>

    <section class="grid">
      <form class="card form" id="form">
        <label class="field">
          <span>要说的文字</span>
          <textarea id="text" rows="5" maxlength="5000" spellcheck="false">今天天气不错，我们一起去爬爬山吧</textarea>
        </label>

        <div class="row three">
          <label class="field">
            <span>语言</span>
            <select id="language">
              <option value="Chinese" selected>中文</option>
              <option value="English">English</option>
              <option value="Japanese">日本語</option>
              <option value="Korean">한국어</option>
              <option value="German">Deutsch</option>
              <option value="French">Français</option>
              <option value="Spanish">Español</option>
              <option value="Russian">Русский</option>
              <option value="">Auto</option>
            </select>
          </label>
          <label class="field">
            <span>步数</span>
            <input id="steps" type="number" min="1" max="200" value="32">
          </label>
          <label class="field">
            <span>Seed</span>
            <input id="seed" type="number" min="0" value="1234">
          </label>
        </div>

        <div class="row two">
          <label class="field">
            <span>CFG</span>
            <input id="cfg" type="number" min="0" max="10" step="0.1" value="2.0">
          </label>
          <label class="field">
            <span>音色 / 风格（可选）</span>
            <input id="instruct" type="text" placeholder="male, british accent">
          </label>
        </div>

        <details class="advanced">
          <summary>Voice clone（参考音频）</summary>
          <div class="refbox">
            <label class="drop" id="drop">
              <input id="ref-file" type="file" accept="audio/wav,audio/x-wav,audio/*">
              <span class="drop-title">拖入或选择一段 WAV 参考音频</span>
              <span class="drop-sub" id="ref-status">24 kHz / 单声道最好；会自动做静音裁剪与 RMS 归一化</span>
            </label>
            <label class="field">
              <span>参考音频转写（可选，但推荐）</span>
              <input id="ref-text" type="text" placeholder="希望你以后过的比我还好哟！">
            </label>
          </div>
        </details>

        <div class="actions">
          <button id="generate" type="submit">
            <span class="btn-label">生成语音</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <button id="clear" type="button" class="ghost">清空</button>
          <span class="hint" id="hint">首次生成会加载权重，之后是秒级。</span>
        </div>
      </form>

      <section class="card player">
        <div class="player-head">
          <div>
            <p class="eyebrow">OUTPUT</p>
            <h2>生成结果</h2>
          </div>
          <span class="badge" id="backend-badge">—</span>
        </div>

        <div class="wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <audio id="audio" controls preload="metadata"></audio>

        <div class="stats">
          <div><span>时长</span><strong id="stat-duration">—</strong></div>
          <div><span>生成耗时</span><strong id="stat-time">—</strong></div>
          <div><span>RTF</span><strong id="stat-rtf">—</strong></div>
        </div>

        <a id="download" class="download disabled" download="ovnative.wav">下载 WAV</a>
        <p class="empty" id="empty">还没有生成。左边写好句子，点“生成语音”。</p>
      </section>
    </section>

    <footer class="foot">
      <span>OVNative · native TTS runtime</span>
      <span>所有计算都在本机完成 · <a href="https://github.com/AFun9/ovnative" target="_blank" rel="noreferrer">GitHub</a></span>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
