name: windows-cuda-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Jimver/cuda-toolkit@v0.2.23
        id: cuda-toolkit
        with:
          cuda: '12.6.3'
      - name: Configure (MSVC x64, CUDA, Ninja)
        run: cmake -S cpp -B cpp/build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DOV_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89
      - name: Build
        run: cmake --build cpp/build-cuda --parallel
